# 生产示例：强制鉴权 + encrypted 存储，不含内置 RustFS。
# 用法：
#   cp .env.example .env   # 填入 S3C_TOKEN / S3C_STORE_KEY
#   docker compose -f docker-compose.prod.yml up -d --build
#
# HTTP（回环 :8080）。启用 TLS 请叠加：
#   docker compose -f docker-compose.prod.yml -f docker-compose.tls.yml up -d
# 证书放在 ./certs/{fullchain,privkey}.pem（见 deploy/nginx/conf.d/s3clinet-tls.example.conf）。

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: s3clinet/server:${S3C_IMAGE_TAG:-v1.0.0-rc1}
    container_name: s3clinet-server
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    expose:
      - "8080"
    environment:
      S3C_ADDR: "0.0.0.0:8080"
      S3C_SHUTDOWN_TIMEOUT: "${S3C_SHUTDOWN_TIMEOUT:-30}"
      S3C_DATA_DIR: "/data"
      S3C_STORE_DRIVER: "encrypted"
      S3C_STORE_KEY: "${S3C_STORE_KEY:?set S3C_STORE_KEY}"
      S3C_STATIC_DIR: "/web/dist"
      S3C_REGION: "${S3C_REGION:-us-east-1}"
      S3C_TOKEN: "${S3C_TOKEN:?set S3C_TOKEN}"
      S3C_CORS_ORIGINS: "${S3C_CORS_ORIGINS:-}"
      S3C_LOG_LEVEL: "${S3C_LOG_LEVEL:-info}"
    volumes:
      - s3c-data:/data
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  nginx:
    image: nginx:1.27.4-alpine
    container_name: s3clinet-nginx
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/s3clinet-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  s3c-data:
