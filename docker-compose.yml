services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
      args:
        # 国内网络可覆盖：GOPROXY=https://goproxy.io,direct  NPM_REGISTRY=https://registry.npmmirror.com
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: s3clinet/server:v1.0.0-rc1
    container_name: s3clinet-server
    restart: unless-stopped
    stop_signal: SIGTERM
    stop_grace_period: 30s
    # 安全默认：不直接暴露端口；经 nginx（worker_processes=1）统一入口 :8080
    expose:
      - "8080"
    # 让后端容器能按服务名访问 rustfs（server 侧：列表/签名/复制/迁移/删除）。
    # 注意：前端“直传”用预签名 URL，其 S3 端点必须能被【浏览器】解析。
    # 若连宿主机浏览器都用，请把账号端点配成浏览器可达地址（如宿主发布的
    # http://127.0.0.1:9000），并让 server 也能找到它——最简单是给 server 加
    # `network_mode: host`（Linux）。本 compose 默认用服务名 rustfs:9000，
    # 仅验证 server↔rustfs 服务端链路；浏览器直传请按实际 S3 端点配置。
    # 安全默认：仅回环发布；需要远程访问时改为 "8080:8080" 并务必设置 S3C_TOKEN。
    # 直连调试（绕过 nginx）：取消下行注释
    # ports:
    #   - "127.0.0.1:8081:8080"
    environment:
      S3C_ADDR: "0.0.0.0:8080"
      S3C_SHUTDOWN_TIMEOUT: "${S3C_SHUTDOWN_TIMEOUT:-30}"
      S3C_DATA_DIR: "/data"
      # 生产推荐 sqlite 或 encrypted（encrypted 需 S3C_STORE_KEY）
      S3C_STORE_DRIVER: "${S3C_STORE_DRIVER:-sqlite}"
      S3C_STORE_KEY: "${S3C_STORE_KEY:-}"
      S3C_STATIC_DIR: "/web/dist"
      S3C_REGION: "${S3C_REGION:-us-east-1}"
      # 非回环监听强制鉴权：未设置则 compose 启动失败
      S3C_TOKEN: "${S3C_TOKEN:?set S3C_TOKEN in .env (openssl rand -hex 32)}"
      # 从外部访问需跨域时填写（留空 = 仅 localhost/tauri）
      S3C_CORS_ORIGINS: "${S3C_CORS_ORIGINS:-}"
      S3C_LOG_LEVEL: "${S3C_LOG_LEVEL:-info}"
    volumes:
      - s3c-data:/data
    depends_on:
      rustfs:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:1.27.4-alpine
    container_name: s3clinet-nginx
    restart: unless-stopped
    stop_signal: SIGQUIT
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/nginx/nginx.docker.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d/s3clinet-docker.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  rustfs:
    # pin 版本避免 latest 漂移导致 E2E flaky
    image: rustfs/rustfs:1.0.0-rc.3
    container_name: s3clinet-rustfs
    restart: unless-stopped
    ports:
      # 安全默认：仅回环发布（RustFS 控制台 / S3 API）。
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: "${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}"
      RUSTFS_SECRET_KEY: "${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}"
      RUSTFS_CORS_ALLOWED_ORIGINS: "${RUSTFS_CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "${RUSTFS_CORS_ORIGINS:-http://127.0.0.1:8080,http://localhost:8080}"
      RUSTFS_OBS_LOGGER_LEVEL: error
    volumes:
      - rustfs-data:/data
    healthcheck:
      # 不依赖镜像内 curl：用 BusyBox/wget 或纯 TCP 探测
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health 2>/dev/null || curl -sf http://127.0.0.1:9000/health 2>/dev/null || (exec 3<>/dev/tcp/127.0.0.1/9000)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  s3c-data:
  rustfs-data:
