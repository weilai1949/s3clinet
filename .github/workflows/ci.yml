name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Go 后端（gofmt / vet / race / cover / build）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: gofmt
        working-directory: server
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "gofmt needed on:" >&2
            echo "$out" >&2
            exit 1
          fi

      - name: Vet
        working-directory: server
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.13.2
          working-directory: server
          args: --timeout=5m

      - name: Test (race + cover)
        working-directory: server
        run: |
          go test -race -count=1 -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out | tee coverage.txt
          # 整体覆盖率守卫（2026-09 提升至 90% 基线；防止显著回退）
          pct=$(go tool cover -func=coverage.out | awk '/total:/ {gsub(/%/,"",$3); print $3}')
          awk -v p="$pct" 'BEGIN { if (p+0 < 90) { print "coverage " p "% < 90%"; exit 1 } }'

      - name: Build
        working-directory: server
        run: go build -ldflags="-X main.version=ci" -o /dev/null .

  web:
    name: Web 前端（typecheck / test / build）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: web
        run: pnpm lint

      - name: Typecheck
        working-directory: web
        run: pnpm typecheck

      - name: Test
        working-directory: web
        run: pnpm test

      - name: Build
        working-directory: web
        run: pnpm build

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: server/Dockerfile
          push: false
          tags: s3clinet/server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (CRITICAL/HIGH 失败门禁)
        # 直接使用 aquasecurity/trivy 官方镜像避免第三方 action 供应链风险；
        # 扫描本地刚构建的镜像（未 push），fail on CRITICAL/HIGH。
        # 范围：只扫 OS 与库（不扫语言包，alpine musl 无此问题）；
        # 只关注已发布修复的漏洞（--ignore-unfixed）；
        # .trivyignore 集中收纳极少数确认可忽略的 CVE。
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/.trivyignore:/trivy/.trivyignore:ro" \
            aquasecurity/trivy:0.58.1 image \
            --severity CRITICAL,HIGH \
            --vuln-type os,library \
            --exit-code 1 \
            --no-progress \
            --ignore-unfixed \
            --ignorefile /trivy/.trivyignore \
            s3clinet/server:ci

  desktop:
    name: Desktop（cargo check）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: System deps (webkit/gtk for tauri/wry)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Placeholder frontendDist for tauri generate_context
        run: |
          mkdir -p web/dist
          printf '%s\n' '<!doctype html><title>ci</title>' > web/dist/index.html
      - name: cargo check
        working-directory: desktop/src-tauri
        run: cargo check --locked

  # 完整 Tauri 链接较重（webkit 依赖 + 前端 build），仅手动触发，不阻塞 PR。
  desktop-build:
    name: Desktop（tauri build --no-bundle）
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Build web
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Install tauri-cli (cached across runs)
        working-directory: desktop
        run: cargo install tauri-cli --version "^2" --locked
      - name: tauri build --no-bundle
        working-directory: desktop
        run: |
          pnpm install --frozen-lockfile
          cd src-tauri && cargo tauri build --no-bundle
