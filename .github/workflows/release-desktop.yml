# 打 tag（v*）或手动指定 tag 时，交叉打包桌面安装包并挂到 GitHub Release。
# 产物：Windows NSIS (.exe)、Linux .deb、macOS .dmg（未公证，用户需自行允许打开）。
name: Release Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已有 tag（如 v1.0.0-rc0），用于补打安装包并挂到 Release'
        required: true
        type: string

concurrency:
  group: release-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (nsis / exe)
            platform: windows-latest
            bundles: nsis
          - name: Linux (deb)
            platform: ubuntu-22.04
            bundles: deb
          - name: macOS (dmg)
            platform: macos-latest
            bundles: dmg

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 90

    steps:
      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "tag must start with v, got: $TAG" >&2; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *"-rc"* || "$TAG" == *"-alpha"* || "$TAG" == *"-beta"* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            web/pnpm-lock.yaml
            desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: System deps (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install web
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Install desktop
        working-directory: desktop
        run: pnpm install --frozen-lockfile

      - name: Build & upload to GitHub Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ steps.meta.outputs.tag }}
          releaseName: s3clinet ${{ steps.meta.outputs.tag }}
          releaseBody: |
            Desktop installers for **${{ steps.meta.outputs.tag }}**.

            | Platform | Artifact |
            |----------|----------|
            | Windows | NSIS installer (`.exe`) |
            | Linux | Debian package (`.deb`) |
            | macOS | Disk image (`.dmg`, unsigned) |

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ steps.meta.outputs.tag }}/CHANGELOG.md) for release notes.
          releaseDraft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          uploadUpdaterJson: false
          args: --bundles ${{ matrix.bundles }}

      - name: Generate SHA256SUMS and upload
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          cd desktop/src-tauri/target/release/bundle
          files=$(find . -type f \( -name '*.exe' -o -name '*.deb' -o -name '*.dmg' -o -name '*.msi' -o -name '*.rpm' -o -name '*.AppImage' \) | sed 's|^\./||')
          if [ -z "$files" ]; then
            echo "no bundle artifacts found" >&2
            exit 1
          fi
          # shellcheck disable=SC2086
          sha256sum $files > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
